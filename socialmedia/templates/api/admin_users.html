<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Users</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#050505;
    color:white;
    font-family:Arial;
    padding:30px;
}

/* ================= TITLE ================= */
h2{
    text-align:center;
    font-size:40px;
    font-weight:800;
    color:#00eaff;
    text-shadow:0 0 15px #00eaff;
    margin-bottom:30px;
}

/* ================= TABLE CONTAINER ================= */
.table-container{
    max-width:900px;
    margin:auto;
    padding:20px;
    border-radius:20px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(0,255,255,0.2);
    box-shadow:0 0 25px rgba(0,255,255,0.08);
    backdrop-filter: blur(8px);
}

/* ================= TABLE ================= */
.table{
    color:white;
    border-radius:15px;
    overflow:hidden;
}

/* HEADER */
.table thead{
    background:rgba(0,255,255,0.15);
    color:#00eaff;
    text-transform:uppercase;
    letter-spacing:1px;
}

/* ROW */
.table tbody tr{
    transition:0.3s;
}

.table tbody tr:hover{
    background:rgba(0,255,255,0.08);
    transform:scale(1.01);
    box-shadow:0 0 15px rgba(0,255,255,0.2);
}

/* CELLS */
.table td, .table th{
    padding:15px;
    vertical-align:middle;
}

/* ID COLUMN STYLE */
.table td:first-child{
    color:#ffcc00;
    font-weight:bold;
}

/* EMAIL STYLE */
.table td:nth-child(2){
    color:#b3e5ff;
}

/* NAME STYLE */
.table td:nth-child(3){
    color:#ffffff;
    font-weight:600;
}

</style>
</head>

<body>

<h2>👥 All Users</h2>

<div class="table-container">

<table class="table table-dark table-hover">

    <thead>
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Name</th>
        </tr>
    </thead>

    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.full_name }}</td>
        </tr>
        {% endfor %}
    </tbody>

</table>

</div>

</body>
</html>
