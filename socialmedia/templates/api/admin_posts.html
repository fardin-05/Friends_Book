<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Posts Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#050505;
    color:white;
    font-family:Arial;
    padding:30px;
}

/* ================= TITLE ================= */
h2{
    text-align:center;
    font-size:44px;
    font-weight:900;
    color:#00eaff;
    text-shadow:0 0 20px #00eaff;
    margin-bottom:25px;
}

/* ================= GRID ================= */
.post-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
    gap:25px;
    max-width:1100px;
    margin:auto;
}

/* ================= CARD ================= */
.post-card{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(0,255,255,0.15);
    border-radius:16px;
    padding:18px;
    transition:0.35s ease;
    position:relative;
    overflow:hidden;
}

/* ===== ULTRA NEON HOVER ===== */
.post-card:hover{
    transform:translateY(-10px) scale(1.03);

    box-shadow:
        0 0 10px rgba(0,255,255,0.6),
        0 0 25px rgba(0,255,255,0.6),
        0 0 50px rgba(0,255,255,0.6),
        0 0 80px rgba(0,255,255,0.4),
        0 0 120px rgba(0,255,255,0.3);
}

/* animated glow sweep */
.post-card::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(120deg, transparent, rgba(0,255,255,0.2), transparent);
    transition:0.6s;
}

.post-card:hover::before{
    left:100%;
}

/* USER */
.post-user{
    color:#00c6ff;
    font-weight:bold;
    margin-bottom:10px;
}

/* CONTENT */
.post-content{
    color:#fff;
    margin-bottom:15px;
}

/* ================= BUTTONS ================= */
.btn{
    border-radius:8px;
    font-weight:bold;
    transition:0.25s ease;
}

/* EDIT */
.btn-warning{
    background:#ffcc00;
    border:none;
    color:black;
}

.btn-warning:hover{
    transform:scale(1.1);
    box-shadow:
        0 0 10px #ffcc00,
        0 0 25px #ffcc00,
        0 0 50px #ffcc00;
}

/* DELETE */
.btn-danger{
    background:#ff3b3b;
    border:none;
}

.btn-danger:hover{
    transform:scale(1.1);
    box-shadow:
        0 0 10px #ff3b3b,
        0 0 25px #ff3b3b,
        0 0 50px #ff3b3b;
}

</style>
</head>

<body>

<h2>📝 All Posts</h2>

<div class="post-grid">

    {% for post in posts %}
    <div class="post-card">

        <div class="post-user">👤 {{ post.user.full_name }}</div>

        <div class="post-content">{{ post.content }}</div>

        <div>
            <a href="{% url 'edit_post' post.pk %}" class="btn btn-warning btn-sm">Edit</a>
            <a href="{% url 'delete_post' post.pk %}" class="btn btn-danger btn-sm">Delete</a>
        </div>

    </div>
    {% endfor %}

</div>

</body>
</html>
