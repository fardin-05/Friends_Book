{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notifications</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

/* 🌌 BACKGROUND */
body{
    background: #05070a;
    color:white;
    font-family: 'Poppins', sans-serif;
    padding:20px;
}

/* 🏠 HOME BUTTON */
.home-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    text-decoration:none;
    color:#fff;
    padding:6px 14px;
    border-radius:12px;
    background: linear-gradient(45deg,#00c6ff,#7f00ff);
    transition:0.3s;
    font-size:14px;
}

.home-btn:hover{
    transform:scale(1.08);
    box-shadow:0 0 12px #00c6ff;
}

/* 🔔 TITLE */
.notif-title{
    color:#ffd700;
    text-shadow:0 0 10px rgba(255,215,0,0.5);
    margin-bottom:20px;
}

/* 📦 CONTAINER */
.notif-container{
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* 🧾 CARD */
.notif-card{
    display:flex;
    gap:12px;
    padding:14px;
    border-radius:14px;

    background: rgba(255,215,0,0.05);
    border:1px solid rgba(255,215,0,0.2);

    transition:0.3s;
}

/* ✨ HOVER EFFECT */
.notif-card:hover{
    transform:translateY(-4px);
    box-shadow:0 0 15px rgba(255,215,0,0.4);
    background: rgba(255,215,0,0.1);
}

/* 🟡 UNREAD */
.notif-card.unread{
    border-left:4px solid #ffd700;
    background: rgba(255,215,0,0.08);
}

/* 🔴 DOT */
.dot{
    width:10px;
    height:10px;
    background:red;
    border-radius:50%;
    margin-top:6px;
}

/* 📝 TEXT */
.notif-content p{
    margin:0;
    color:#fff3b0;
    font-size:14px;
}

.notif-content small{
    color:#aaa;
    font-size:11px;
}

/* 😴 EMPTY STATE */
.no-notif{
    text-align:center;
    padding:25px;
    border-radius:12px;
    background: rgba(255,255,255,0.03);
    border:1px dashed rgba(255,255,255,0.1);
    color:#777;
}

</style>

</head>

<body>

<!-- 🏠 HOME BUTTON -->
<a href="{% url 'home' %}" class="home-btn mb-3">
    <i class="bi bi-house-door-fill"></i> Home
</a>

<h3 class="notif-title">🔔 Notifications</h3>

<div class="notif-container">

{% for n in notifications %}
    <div class="notif-card {% if not n.is_read %}unread{% endif %}">
        
        <div>
            {% if not n.is_read %}
                <span class="dot"></span>
            {% endif %}
        </div>

        <div class="notif-content">
            <p>{{ n.message }}</p>
            <small>{{ n.created_at|timesince }} ago</small>
        </div>

    </div>
{% empty %}
    <div class="no-notif">
        😴 No notifications yet
    </div>
{% endfor %}

</div>

</body>
</html>
