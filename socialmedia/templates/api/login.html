{% load static %}
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* 🌈 BACKGROUND */
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617 70%);
    color: #fff;
    overflow: hidden;
}

/* ✨ FLOATING LIGHTS */
body::before {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(0,255,255,0.08) 2px, transparent 2px);
    background-size: 80px 80px;
    animation: move 40s linear infinite;
    z-index: -1;
}

@keyframes move {
    from {transform: translate(0,0);}
    to {transform: translate(-300px,-300px);}
}

/* 🧊 CENTER */
.login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* 💎 CARD */
.login-card {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(0,255,255,0.2);
    border-radius: 18px;
    padding: 40px 30px;
    box-shadow: 0 0 25px rgba(0,255,255,0.15);
    animation: floatUp 0.8s ease;
}

@keyframes floatUp {
    from {transform: translateY(20px); opacity: 0;}
    to {transform: translateY(0); opacity: 1;}
}

/* 🔵 TITLE */
h2 {
    text-align: center;
    font-weight: 700;
    color: #00eaff;
    text-shadow: 0 0 10px #00eaff;
    margin-bottom: 25px;
}

/* 🧾 INPUT */
.form-control {
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(0,255,255,0.2);
    color: white;
}

.form-control:focus {
    box-shadow: 0 0 15px #00eaff;
    border-color: #00eaff;
    background: rgba(255,255,255,0.12);
    color: white;
}

/* 👁️ PASSWORD BOX */
.password-box {
    position: relative;
}

.toggle-eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
    color: #00eaff;
    transition: 0.3s;
    user-select: none;
}

.toggle-eye:hover {
    text-shadow: 0 0 10px #00eaff;
    transform: translateY(-50%) scale(1.2);
}

/* 🚀 BUTTON */
button[type="submit"] {
    width: 100%;
    background: linear-gradient(45deg, #00c6ff, #7f00ff);
    border: none;
    padding: 10px;
    border-radius: 10px;
    font-weight: 600;
    transition: 0.3s;
}

button[type="submit"]:hover {
    transform: scale(1.03);
    box-shadow: 0 0 20px #00c6ff;
}

/* 🔗 LINK */
.bottom-text {
    text-align: center;
    margin-top: 15px;
}

.bottom-text a {
    color: #00eaff;
    text-decoration: none;
}

.bottom-text a:hover {
    text-shadow: 0 0 10px #00eaff;
}

/* ❌ ERROR */
.alert {
    border-radius: 10px;
    background: rgba(255,0,0,0.1);
    border: 1px solid rgba(255,0,0,0.3);
    color: #ff6b6b;
}

</style>
</head>

<body>

<div class="login-wrapper">
    <div class="login-card">

        <h2>🔐 Login</h2>

        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
                <div class="alert py-2 text-center">
                    ❌ please provide correct information
                </div>
            {% endif %}

            {% for field in form %}
                <div class="mb-3">

                    <label class="form-label">{{ field.label }}</label>

                    <!-- 👇 PASSWORD FIELD ONLY -->
                    {% if "password" in field.name %}
                        <div class="password-box">
                            {{ field }}
                            <span class="toggle-eye" onclick="togglePassword()">👁️</span>
                        </div>
                    {% else %}
                        {{ field }}
                    {% endif %}

                </div>
            {% endfor %}

            <button type="submit">Login</button>
        </form>

        <div class="bottom-text">
            <p>new user? <a href="{% url 'register' %}">Register</a></p>
        </div>

    </div>
</div>

<script>
function togglePassword() {
    const input = document.querySelector('input[type="password"], input[type="text"][name="password"]');
    const icon = document.querySelector(".toggle-eye");

    if (!input) return;

    if (input.type === "password") {
        input.type = "text";
        icon.innerHTML = "🙈";
    } else {
        input.type = "password";
        icon.innerHTML = "👁️";
    }
}

/* add bootstrap class */
document.querySelectorAll("input").forEach(el => {
    el.classList.add("form-control");
});
</script>

</body>
</html>
