<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    font-family: Arial;
    background:#050505;
    color:white;
}

/* =========================
   DASHBOARD TITLE (NEON)
========================= */
.dashboard-title{
    text-align:center;
    font-size:80px;
    font-weight:900;
    letter-spacing:14px;
    margin-top:50px;
    color:#00eaff;

    text-shadow:
        0 0 2px #00eaff,
        0 0 8px #00eaff,
        0 0 18px #00eaff,
        0 0 35px #00eaff,
        0 0 70px #00eaff;

    animation: neonPulse 2.8s ease-in-out infinite alternate;
}

@keyframes neonPulse {
    0% {
        opacity: 0.9;
        text-shadow: 0 0 5px #00eaff, 0 0 15px #00eaff, 0 0 30px #00eaff;
    }
    100% {
        opacity: 1;
        text-shadow: 0 0 10px #00eaff, 0 0 40px #00eaff, 0 0 90px #00eaff;
    }
}

/* =========================
   STATS
========================= */
.stats{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:40px;
}

.stat{
    width:200px;
    padding:20px;
    text-align:center;
    border-radius:15px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(0,255,255,0.2);
    transition:0.3s;
}

.stat:hover{
    transform:scale(1.05);
    box-shadow:
        0 0 15px rgba(0,255,255,0.4),
        0 0 35px rgba(0,255,255,0.3),
        0 0 60px rgba(0,255,255,0.2);
}

.stat h2{
    color:#00eaff;
}

/* =========================
   PANEL BOX
========================= */
.admin-panel{
    margin-top:60px;
    text-align:center;
}

.panel-box{
    display:inline-block;
    padding:35px 45px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(0,255,255,0.25);
    box-shadow:0 0 25px rgba(0,255,255,0.1);
    transition:0.35s ease;
}

.panel-box:hover{
    transform:translateY(-8px) scale(1.03);
    box-shadow:
        0 0 10px rgba(0,255,255,0.4),
        0 0 30px rgba(0,255,255,0.5),
        0 0 60px rgba(0,255,255,0.6),
        0 0 90px rgba(0,255,255,0.3);
}

/* =========================
   BUTTONS
========================= */
.panel-box a{
    display:block;
    margin:15px 0;
    padding:12px 30px;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
    transition:0.3s ease;
}

/* USERS */
.users{
    color:#00c6ff;
    border:1px solid #00c6ff;
}
.users:hover{
    background:#00c6ff;
    color:black;
    transform:scale(1.08);
    box-shadow:
        0 0 10px #00c6ff,
        0 0 30px #00c6ff,
        0 0 60px #00c6ff;
}

/* POSTS */
.posts{
    color:#ffcc00;
    border:1px solid #ffcc00;
}
.posts:hover{
    background:#ffcc00;
    color:black;
    transform:scale(1.08);
    box-shadow:
        0 0 10px #ffcc00,
        0 0 30px #ffcc00,
        0 0 60px #ffcc00;
}

/* LOGOUT */
.logout{
    color:#ff3b3b;
    border:1px solid #ff3b3b;
}
.logout:hover{
    background:#ff3b3b;
    color:white;
    transform:scale(1.08);
    box-shadow:
        0 0 10px #ff3b3b,
        0 0 30px #ff3b3b,
        0 0 60px #ff3b3b;
}

</style>
</head>

<body>

<div class="dashboard-title">
    DASHBOARD
</div>

<div class="stats">

    <div class="stat">
        <h5>Users</h5>
        <h2>{{ users.count }}</h2>
    </div>

    <div class="stat">
        <h5>Posts</h5>
        <h2>{{ posts.count }}</h2>
    </div>

</div>

<div class="admin-panel">

    <div class="panel-box">

        <h3 style="margin-bottom:20px;color:#aaa;">ACTION'S</h3>

        <a href="{% url 'admin_users' %}" class="users">👤 USERS</a>

        <a href="{% url 'admin_posts' %}" class="posts">📝 POSTS</a>

        <a href="{% url 'logout' %}" class="logout">🚪 LOGOUT</a>

    </div>

</div>

</body>
</html>
